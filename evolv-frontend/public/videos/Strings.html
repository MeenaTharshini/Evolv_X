<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EVOLV Strings Lesson</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Tamil:wght@500;600&display=swap">
<style>
/* Layout: one dark stage card (logo, code + output, string visual, headline, subtitle), chapter tabs, control bar.
   Single dark look by choice, matching the EVOLV lesson screenshot. */
:root{
  --bg:#070c1b; --panel:#0d1430; --panel2:#111a3b; --line:#1d2a55; --ink:#e9edfb; --mute:#7a89b4;
  --cyan:#4fd1ff; --amber:#ffb547; --green:#4ade80; --pink:#ff5f8d; --purple:#b69cff; --red:#ff6b6b;
  --display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --tamil:'Noto Sans Tamil','Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--display); font-size:15px;
  padding-block:14px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(rgba(79,209,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(79,209,255,.045) 1px,transparent 1px);
  background-size:40px 40px;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* stage */
.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;padding:18px clamp(12px,3vw,28px) 16px;
  background:radial-gradient(120% 80% at 50% 0%,#0f1838 0%,#0a1024 60%,#080d1f 100%);
  display:flex;flex-direction:column;align-items:center;gap:14px;min-height:640px}
.stage>*{position:relative;z-index:1;min-width:0;max-width:100%}
.meadow{position:absolute!important;left:0;right:0;bottom:0;width:100%;height:150px;z-index:0!important;pointer-events:none;opacity:.9}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.28em;font-size:15px}
.work{width:100%;max-width:940px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
@media(max-width:720px){.work{grid-template-columns:minmax(0,1fr)}}
.win{background:#0e1531;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:#8fa0d0}
.bar i{width:11px;height:11px;border-radius:50%;display:block}
.bar .r{background:#ff5f57}.bar .y{background:#febc2e}.bar .g{background:#28c840}
.bar span{margin-left:8px}.bar em{margin-left:auto;font-style:normal;color:var(--mute)}
.body{padding:10px 0;font-family:var(--mono);font-size:clamp(13px,1.9vw,17px);min-height:128px}
.ln{display:flex;gap:16px;padding:4px 16px;border-left:3px solid transparent;transition:background .35s,border-color .35s;white-space:pre-wrap;word-break:break-word}
.ln b.n{color:#4b5a8a;font-weight:500;min-width:1.1em;text-align:right}
.ln.on{background:rgba(79,209,255,.12);border-left-color:var(--cyan)}
.ln.fresh{animation:slide .5s both}
.kw{color:var(--purple)}.nm{color:var(--green)}.fn{color:var(--cyan)}.cm{color:#5d6c9a}.st{color:var(--amber)}
.qt{font-weight:700;color:#ffd48a;text-shadow:0 0 10px rgba(255,181,71,.55)}
.hq .qt{animation:glow 1s ease-in-out infinite alternate}
.outbody{padding:10px 16px;min-height:128px;font-family:var(--mono);font-size:clamp(13px,1.9vw,17px)}
.ol{padding:4px 0;white-space:pre-wrap;word-break:break-word;color:#d9fbe6}
.ol.new{animation:slide .5s both}
.ol.q{color:var(--amber);animation:pulse 1.2s infinite}
.ol.err{color:var(--red)}
.ol::before{content:'› ';color:var(--green)}
.ol.err::before{content:'✕ ';color:var(--red)}
.idle{color:var(--mute);font-size:13px}

.viz{width:100%;max-width:940px;min-height:118px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;overflow-x:auto;padding:14px 6px 22px}
.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.sbox{position:relative;display:inline-flex;align-items:center;gap:5px;padding:20px 12px 12px;border:2px solid rgba(74,222,128,.55);border-radius:16px;background:rgba(74,222,128,.07);animation:pop .5s both}
.sbox.sm{padding:16px 8px 8px;gap:3px}.sbox.sm .cb{width:clamp(18px,3vw,30px);height:clamp(24px,3.8vw,38px);font-size:clamp(11px,1.8vw,18px)}
.sbox .tag{position:absolute;top:-10px;left:14px;background:#0b2a1d;color:var(--green);font:700 10px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid rgba(74,222,128,.5)}
.qm{font:800 clamp(28px,5vw,44px)/1 var(--mono);color:var(--amber);text-shadow:0 0 16px rgba(255,181,71,.5);animation:glow 1.1s ease-in-out infinite alternate}
.cb{position:relative;width:clamp(26px,4.6vw,48px);height:clamp(34px,5.8vw,58px);display:grid;place-items:center;border:2px solid var(--cyan);border-radius:10px;background:#0d1a3d;font:700 clamp(15px,2.8vw,26px) var(--mono);animation:drop .45s both;animation-delay:calc(var(--i)*70ms)}
.cb.sp{border-style:dashed;color:var(--mute);font-size:12px}
.cb.hl{background:var(--amber);color:#1a1200;border-color:var(--amber);box-shadow:0 0 22px rgba(255,181,71,.6);transform:translateY(-6px)}
.cb.ghost{border-color:var(--red);border-style:dashed;color:var(--red);background:rgba(255,107,107,.08)}
.ix{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font:700 12px var(--mono);color:var(--cyan)}
.ix.ct{color:var(--amber);animation:pop .3s both;animation-delay:calc(var(--i)*320ms + 200ms)}
.cap{font-size:12px;color:var(--mute);text-align:center;margin-top:2px}
.op{font:800 clamp(24px,4vw,36px) var(--mono);color:var(--cyan);animation:pop .4s both}
.vname{padding:10px 16px;border-radius:12px;border:2px solid var(--cyan);background:rgba(79,209,255,.08);font:700 15px var(--mono);color:var(--cyan);animation:pop .4s both;display:flex;flex-direction:column;align-items:center;gap:2px}
.vname small{font:600 10px var(--display);color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.arrow{font:800 26px var(--mono);color:var(--amber);animation:pop .4s both}
.pill{padding:10px 16px;border-radius:12px;font:700 clamp(13px,2vw,17px) var(--mono);border:1.5px solid var(--line);background:#0e1633;animation:pop .45s both;animation-delay:calc(var(--i,0)*120ms)}
.pill.g{border-color:rgba(74,222,128,.6);color:var(--green)}.pill.c{border-color:rgba(79,209,255,.6);color:var(--cyan)}.pill.a{border-color:rgba(255,181,71,.6);color:var(--amber)}.pill.r{border-color:rgba(255,107,107,.7);color:var(--red)}
.pill.dim{opacity:.4;filter:saturate(.4)}
.pill small{display:block;font:600 11px var(--display);color:var(--mute);margin-top:3px}
.bubble{max-width:260px;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(255,107,107,.6);background:rgba(255,107,107,.08);color:#ffc1c1;font-size:13.5px;animation:pop .5s both}
.float{animation:bob 3s ease-in-out infinite}

.head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.chip{font:700 12px var(--mono);color:var(--green);border:1px solid rgba(74,222,128,.55);background:rgba(74,222,128,.07);padding:6px 14px;border-radius:99px;animation:pop .5s both}
h1{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.12;font-size:clamp(26px,5vw,46px);text-wrap:balance}
h1 a{color:var(--amber);text-decoration:none}

.subbox{width:100%;max-width:880px;display:flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(6,10,24,.78);backdrop-filter:blur(3px);min-height:74px}
.subbox .evo{flex:0 0 58px;width:58px;height:58px}
#sub{flex:1;min-width:0;text-align:center;line-height:1.45}
#sub .ta{font:600 clamp(15px,2.2vw,20px)/1.5 var(--tamil)}
#sub .en{font:500 clamp(13px,1.8vw,16px)/1.45 var(--display);color:#b9c4e8}
#sub .ta+.en{margin-top:4px;color:var(--mute);font-size:clamp(12px,1.6vw,14px)}

/* interaction panel */
.askwrap{width:100%;max-width:880px;border:1.5px solid rgba(255,181,71,.55);background:rgba(255,181,71,.06);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:pop .4s both}
.askwrap .lab{font:800 11px var(--mono);letter-spacing:.14em;color:var(--amber)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.opt{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#0d1531;cursor:pointer;text-align:left;font:600 14px var(--mono);transition:border-color .2s,transform .15s,background .2s}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateY(-2px)}
.opt.ok{border-color:var(--green);background:rgba(74,222,128,.14);color:var(--green)}
.opt.no{border-color:var(--red);background:rgba(255,107,107,.1);color:var(--red)}
.fb{font-size:14px;line-height:1.5;min-height:1.5em}
.fb.ok{color:var(--green)}.fb.no{color:#ffb4b4}.fb.hint{color:var(--cyan)}
.fb .ta{font-family:var(--tamil);display:block;margin-top:2px}
.askrow{display:flex;gap:8px;flex-wrap:wrap}
.mini{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#0e1633;cursor:pointer;font-weight:700;font-size:13px}
.mini:hover{border-color:var(--cyan)}
.mini.go{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.tasks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.tasks code{font-family:var(--mono);color:var(--amber)}
.start{padding:14px 28px;border-radius:99px;border:0;background:var(--amber);color:#1a1200;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 0 0 6px rgba(255,181,71,.18);animation:pulse 2s infinite}

/* tabs + controls */
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tab{position:relative;text-align:left;padding:12px 14px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:14px;overflow:hidden;color:#cdd6f4;transition:border-color .2s}
.tab::before{content:'';display:block;height:4px;border-radius:4px;background:#1b2750;margin-bottom:9px}
.tab i{position:absolute;left:14px;top:12px;height:4px;border-radius:4px;background:var(--cyan);width:calc((100% - 28px)*var(--p,0))}
.tab span{color:var(--mute);margin-right:6px;font-weight:600}
.tab.cur{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(79,209,255,.35) inset}
.tab.done i{background:var(--green)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{padding:11px 20px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:15px;transition:border-color .2s}
.btn:hover{border-color:var(--cyan)}
.btn.main{background:var(--amber);color:#1a1200;border-color:var(--amber);min-width:92px}
.btn[aria-pressed="false"]{opacity:.55}
.sel{padding:11px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);font-weight:600;max-width:100%;min-width:0}
.sel.v{border-color:var(--cyan);flex:1 1 240px}
.prog{height:4px;border-radius:4px;background:#16204a;overflow:hidden;width:100%}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green))}

@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes glow{from{opacity:.75}to{opacity:1}}
@keyframes pulse{50%{opacity:.55}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.evo .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.evo .ant{animation:glow .9s ease-in-out infinite alternate}
.evo.talk .mouth{animation:pulse .35s infinite}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<script>
/* ---------- Lesson data, scenes 1-6 ---------- */
const SCENES = [];

SCENES.push({
  tab: 'Welcome', chip: 'Text = String', title: 'Welcome to <a>String Meadow</a>!', file: 'welcome.py',
  code: ['# A string is text', 'word = "Hello"'],
  steps: [
    { mood: 'smile', line: -1, viz: { t: 'hello' },
      en: "Hi! I'm EVO, your guide. Welcome to String Meadow! Today we will learn all about strings.",
      ta: 'வணக்கம்! நான் EVO. String Meadow-க்கு வரவேற்கிறேன்! இன்னைக்கு Strings பத்தி கத்துக்கலாம்.' },
    { mood: 'wow', line: -1, viz: { t: 'cards' },
      en: 'A string is simply text. A name, a message, or even a single word. They are all strings.',
      ta: "String-ன்னா வெறும் text தான். ஒரு பேரு, ஒரு message, ஒரு வார்த்தை, எல்லாமே strings தான்." },
    { mood: 'smile', line: 1, viz: { t: 'box', text: 'Hello' },
      en: 'Think of a string as a small container. Every letter sits inside it, one after another.',
      ta: 'String-ஐ ஒரு சின்ன container மாதிரி நினைச்சுக்கோங்க. ஒவ்வொரு எழுத்தும் அதுக்குள்ள வரிசையா இருக்கும்.' }
  ]
});

SCENES.push({
  tab: 'Create', chip: 'Quotes make strings', title: 'Creating <a>Strings</a>', file: 'create.py',
  code: ['name = "Maya"', "message = 'Hello, Python!'"],
  steps: [
    { mood: 'smile', line: 0, hq: true, viz: { t: 'box', text: 'Maya', cap: 'Double quotes  " "' },
      en: 'To create a string, put your text inside quotation marks. Here, Maya is inside double quotes.',
      ta: 'String உருவாக்க, text-ஐ quotation marks-க்குள்ள போடணும். இங்க Maya, double quotes-க்குள்ள இருக்கு.' },
    { mood: 'smile', line: 1, hq: true, viz: { t: 'box', text: 'Hello, Python!', q: "'", cap: "Single quotes  ' '" },
      en: 'Single quotes work too. Hello, Python! is inside single quotes. Just open and close with the same kind.',
      ta: "Single quotes-உம் வேலை செய்யும். Hello, Python! single quotes-க்குள்ள இருக்கு. தொடங்குற quote-உம் முடிக்கிற quote-உம் ஒரே மாதிரி இருக்கணும்." },
    { mood: 'think', line: [0, 1], hq: true, viz: { t: 'quotes' },
      en: 'The quotes are not part of the text. They simply tell Python: this is text, not a command.',
      ta: "Quotes text-ஓட பகுதி இல்ல. 'இது text, command இல்ல'ன்னு Python-க்கு சொல்றது தான் அவங்க வேலை." }
  ]
});

SCENES.push({
  tab: 'Print', chip: 'print() shows text', title: 'Printing <a>Strings</a>', file: 'print.py',
  code: ['print("Welcome to EVOLV!")'],
  steps: [
    { mood: 'smile', line: 0, out: [], viz: { t: 'box', text: 'Welcome to EVOLV!', cls: 'sm' },
      en: 'The print function shows things on the screen. Put your string inside the brackets.',
      ta: 'print function, screen-ல ஒண்ணை காட்டும். String-ஐ brackets-க்குள்ள போடுங்க.' },

      ta: 'Plus strings-ஐ சேர்க்கும். இதுதான் concatenation.' },
    { mood: 'smile', line: 2, out: ['Hi, Maya', 'HaHaHa'], viz: { t: 'sum', on: 4 },
      en: 'Star repeats a string as many times as you ask.',
      ta: 'Star, நீங்க சொல்ற எண்ணிக்கை அளவுக்கு string-ஐ repeat பண்ணும்.' },
    { mood: 'smile', line: 3, out: ['Hi, Maya', 'HaHaHa', '4'], viz: { t: 'sum', on: 5 },
      en: 'The len function counts the characters. Maya has four.',
      ta: 'len function characters-ஐ எண்ணும். Maya-ல நாலு.' },
    { mood: 'wow', line: 4, out: ['Hi, Maya', 'HaHaHa', '4', 'M'], viz: { t: 'sum', on: 6 },
      en: 'And square brackets with an index pick one character. Remember, index zero is the first one.',
      ta: 'Square brackets-ல index போட்டா ஒரு character கிடைக்கும். ஞாபகம் இருக்கட்டும், index 0 தான் முதல் எழுத்து.' },
    { mood: 'wow', line: -1, viz: { t: 'sum', on: 6 }, practice: {
        tasks: [
          { en: 'Make a variable called <code>my_name</code> with your own name inside quotes.', ta: 'உங்க பேரை quotes-க்குள்ள போட்டு <code>my_name</code> variable உருவாக்குங்க.' },
          { en: 'Print <code>"Hello, "</code> joined with <code>my_name</code>.', ta: '<code>"Hello, "</code>-ஐ <code>my_name</code>-ஓட சேர்த்து print பண்ணுங்க.' },
          { en: 'Print the length of <code>my_name</code>.', ta: '<code>my_name</code>-ன் length-ஐ print பண்ணுங்க.' }
        ],
        hint: { en: 'Use the plus sign for the join and len() for the length.', ta: 'Join பண்ண plus குறியும், length-க்கு len()-உம் பயன்படுத்துங்க.' },
        solution: { code: ['my_name = "Maya"', 'print("Hello, " + my_name)', 'print(len(my_name))'], out: ['Hello, Maya', '4'] },
        finish: { en: 'Well done! You now know the basics of strings. Keep going, your next topic is waiting in Adventure World!', ta: 'அருமை! Strings-ஓட அடிப்படை உங்களுக்கு தெரிஞ்சுடுச்சு. தொடர்ந்து போங்க, அடுத்த topic Adventure World-ல காத்திருக்கு!' }
      },
      en: 'Your turn! Create a variable with your own name. Print Hello joined with it, then print its length. Try it in your head, then peek at a sample solution.',
      ta: 'இப்போ உங்க முறை! உங்க பேரோட ஒரு variable உருவாக்குங்க. Hello-வை அதோட சேர்த்து print பண்ணுங்க, அப்புறம் அதன் length-ஐ print பண்ணுங்க. மனசுல try பண்ணிட்டு, sample solution-ஐ பாருங்க.' }
  ]
});
/* ---------- Player engine ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const S = { si: 0, ti: 0, el: 0, dur: 1, started: false, paused: true, waiting: false, ended: false,
  voice: true, sub: 'ta', code: [], codeKey: '', out: [], prevOut: [], speechDone: true, utt: null, cur: null, curSub: null };
const TOTAL = SCENES.reduce((n, s) => n + s.steps.length, 0);

/* syntax highlighting */
function hi(line) {
  const re = /("[^"]*"|'[^']*')|(#.*$)|\b(\d+)\b|\b(print|len)\b/g;
  let o = '', last = 0, m;
  while ((m = re.exec(line))) {
    o += esc(line.slice(last, m.index));
    if (m[1]) { const q = m[1][0]; o += `<span class="st"><b class="qt">${q}</b>${esc(m[1].slice(1, -1))}<b class="qt">${q}</b></span>`; }
    else if (m[2]) o += `<span class="cm">${esc(m[2])}</span>`;
    else if (m[3]) o += `<span class="nm">${m[3]}</span>`;
    else o += `<span class="fn">${m[4]}</span>`;
    last = re.lastIndex;
  }
  return o + esc(line.slice(last));
}
function renderCode(line, hq) {
  const act = [].concat(line === undefined ? -1 : line);
  const key = S.code.join('\n'), prev = S.codeKey ? S.codeKey.split('\n') : [];
  $('code').classList.toggle('hq', !!hq);
  if (key === S.codeKey) {
    [...$('code').children].forEach((el, i) => el.classList.toggle('on', act.includes(i)));
    return;
  }
  $('code').innerHTML = S.code.map((l, i) =>
    `<div class="ln${act.includes(i) ? ' on' : ''}${prev[i] !== l ? ' fresh' : ''}"><b class="n">${i + 1}</b><span>${hi(l)}</span></div>`).join('');
  S.codeKey = key;
}
function renderOut() {
  const o = S.out;
  $('out').innerHTML = o.length ? o.map((x, i) => {
    const isNew = S.prevOut[i] === undefined || JSON.stringify(S.prevOut[i]) !== JSON.stringify(x);
    if (typeof x === 'object') return `<div class="ol err${isNew ? ' new' : ''}">${esc(x.err)}</div>`;
    return `<div class="ol${x === '?' ? ' q' : ''}${isNew ? ' new' : ''}">${x === '?' ? '? ? ?' : esc(x)}</div>`;
  }).join('') : '<div class="idle">Output will appear here…</div>';
  S.prevOut = o.slice();
}

/* visuals */
function chars(text, o = {}) {
  return [...text].map((c, i) => {
    const sp = c === ' ';
    return `<span class="cb${sp ? ' sp' : ''}${o.hl === i ? ' hl' : ''}" style="--i:${i}">${sp ? '␣' : esc(c)}` +
      (o.idx ? `<small class="ix">${i}</small>` : '') + (o.count ? `<small class="ix ct" style="--i:${i}">${i + 1}</small>` : '') + '</span>';
  }).join('');
}
function sbox(text, o = {}) {
  const q = o.q || '"', Q = o.noq ? '' : `<b class="qm">${q}</b>`;
  return `<div class="sbox${o.cls ? ' ' + o.cls : ''}"><span class="tag">str</span>${Q}${chars(text, o)}${Q}</div>`;
}
const cap = c => c ? `<div class="cap">${esc(c)}</div>` : '';
const evoBig = () => $('evo').outerHTML.replace(/ id="[^"]*"/g, '').replace(/class="evo[^"]*"/, 'class="evo float" style="width:112px;height:112px"');
function viz(v) {
  const sm = { cls: 'sm' };
  switch (v.t) {
    case 'hello': return `<div class="row">${evoBig()}<div class="col">${sbox('Hello, I am EVO!', sm)}${cap('Welcome to String Meadow')}</div></div>`;
    case 'cards': return ['Maya', 'Hello!', 'Python'].map((w, i) => `<div class="col float" style="animation-delay:${i * .4}s">${sbox(w, { cls: 'sm' })}${cap(['a name', 'a message', 'a word'][i])}</div>`).join('');
    case 'box': return `<div class="col">${sbox(v.text, v)}${cap(v.cap)}</div>`;
    case 'quotes': return `<div class="row"><div class="col">${sbox('Maya')}${cap('With quotes: Python sees text')}</div><div class="col"><div class="pill c">Maya<small>Without quotes: Python looks for a name</small></div></div></div>`;
    case 'var': return `<div class="row"><div class="vname"><small>variable</small>${esc(v.name)}</div><span class="arrow">→</span>${sbox(v.text, sm)}${v.print ? `<span class="arrow">→</span><div class="pill g" style="--i:2">${esc(v.text)}<small>printed</small></div>` : ''}</div>`;
    case 'compare': return `<div class="col"><div class="row"><div class="pill c">print(first_name)</div><span class="arrow">→</span><div class="pill g">Maya</div></div><div class="row"><div class="pill a">print("first_name")</div><span class="arrow">→</span><div class="pill r">first_name</div></div></div>`;
    case 'join': {
      const res = v.space ? v.a + ' ' + v.b : v.a + v.b;
      return `<div class="col"><div class="row">${sbox(v.a, sm)}<span class="op">+</span>${v.space ? sbox(' ', sm) + '<span class="op">+</span>' : ''}${sbox(v.b, sm)}<span class="op">=</span>${sbox(res, sm)}</div>${cap(v.space ? 'A string with one space joins the words' : 'No space between them')}</div>`;
    }
    case 'repeat': {
      const copies = Array.from({ length: v.n }, () => sbox(v.text, sm)).join('<span class="op">+</span>');
      return `<div class="col"><div class="row">${sbox(v.text, sm)}<span class="op">×</span><div class="pill a">${v.n}</div></div>` +
        (v.result ? `<div class="row">${copies}</div>${cap('Same as joining ' + v.n + ' copies')}` : '') + '</div>';
    }
    case 'mistake1': return `<div class="row"><div class="pill r">name = <u>Maya</u><small>no quotation marks</small></div><span class="arrow">→</span>` +
      (v.reveal ? `<div class="bubble">Maya? Without quotes I think it is a variable name, and I have never heard of it!</div>` : `<div class="pill a">What is wrong here?</div>`) + '</div>';
    case 'mistake2': return `<div class="col"><div class="row">${sbox('PYTHON', { idx: true })}<span class="cb ghost" style="--i:7">?<small class="ix" style="color:var(--red)">6</small></span></div>` +
      (v.reveal ? `<div class="bubble" style="margin-top:14px">There is no index 6. The last index is 5.</div>` : cap('Is there a slot number 6?')) + '</div>';
    case 'sum': {
      const it = [['" "', 'quotes', 'make a string', 'g'], ['name', 'variable', 'stores text', 'c'], ['+', 'join', 'concatenation', 'a'], ['*', 'repeat', 'copy a string', 'g'], ['len()', 'length', 'counts characters', 'c'], ['[0]', 'index', 'starts at 0', 'a']];
      return `<div class="row">${it.map((x, i) => `<div class="pill ${x[3]}${i >= v.on ? ' dim' : ''}" style="--i:${i}">${esc(x[0])}<small>${x[1]}: ${x[2]}</small></div>`).join('')}</div>`;
    }
  }
  return '';
}

/* EVO mood */
const MOUTH = { smile: 'M31 45 Q40 52 49 45', wow: 'M36 44 Q40 54 44 44', think: 'M33 47 L47 47' };
const setMood = m => $('mouth').setAttribute('d', MOUTH[m] || MOUTH.smile);

/* subtitles + language helpers */
function lang(o) {
  const m = S.sub;
  if (m === 'ta') return o.ta;
  if (m === 'en' || m === 'off') return o.en;
  return `${o.en}<span class="ta">${o.ta}</span>`;
}
function renderSub() {
  const o = S.curSub;
  if (!o) return;
  const m = S.sub;
  $('sub').innerHTML = m === 'off' ? '' : m === 'ta' ? `<div class="ta">${o.ta}</div>`
    : m === 'en' ? `<div class="en">${o.en}</div>` : `<div class="ta">${o.ta}</div><div class="en">${o.en}</div>`;
}
const setSub = o => { S.curSub = o; renderSub(); };

/* narration */
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voices = [];
function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^(en|ta)/i.test(v.lang));
  const sel = $('selVoice'), keep = sel.value;
  sel.innerHTML = voices.length ? voices.map((v, i) => `<option value="${i}">${esc(v.name)} (${esc(v.lang)})</option>`).join('') : '<option value="">Default voice</option>';
  if (voices.length) {
    let pick = voices.findIndex(v => /UK English Female/i.test(v.name));
    if (pick < 0) pick = voices.findIndex(v => /^en-GB/i.test(v.lang));
    if (pick < 0) pick = voices.findIndex(v => /^en/i.test(v.lang));
    sel.value = keep && voices[keep] ? keep : String(Math.max(0, pick));
  }
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
const plain = h => h.replace(/<[^>]+>/g, '').replace(/"/g, '');
function stopSpeech() { if (synth) synth.cancel(); S.utt = null; S.speechDone = true; $('evo').classList.remove('talk'); }
function speak(o) {
  S.cur = o; stopSpeech();
  if (!synth || !S.voice || !S.started || S.paused) return;
  const v = voices[+$('selVoice').value];
  const ta = v && /^ta/i.test(v.lang);
  const u = new SpeechSynthesisUtterance(plain(ta ? o.ta : o.en));
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
  u.rate = 0.95;
  const done = () => { if (S.utt === u) { S.speechDone = true; $('evo').classList.remove('talk'); } };
  u.onend = done; u.onerror = done;
  S.utt = u; S.speechDone = false; $('evo').classList.add('talk');
  synth.speak(u);
}

/* scenes + steps */
function enterScene(si) {
  const sc = SCENES[si];
  S.si = si; S.code = sc.code; S.codeKey = ''; S.out = []; S.prevOut = [];
  $('chip').textContent = sc.chip; $('title').innerHTML = sc.title; $('fname').textContent = sc.file;
  $('chip').style.animation = 'none'; void $('chip').offsetWidth; $('chip').style.animation = '';
}
function apply(st) {
  if (st.code) S.code = st.code;
  if (st.out) S.out = st.out;
  renderCode(st.line, st.hq); renderOut();
  $('viz').innerHTML = viz(st.viz || {});
  setMood(st.mood);
}
function goStep(si, ti) {
  if (si !== S.si || ti === 0 || S.ended) enterScene(si);
  S.ended = false; S.ti = ti;
  const st = SCENES[si].steps[ti];
  S.el = 0; S.dur = 2400 + (st.en || (st.ask && st.ask.q.en) || '').length * 68; S.waiting = false; S.post = false;
  $('ask').hidden = true; $('ask').innerHTML = '';
  apply(st);
  if (st.ask) { showAsk(st); S.waiting = true; setSub(st.ask.q); speak(st.ask.q); }
  else if (st.practice) { showPractice(st); S.waiting = true; setSub(st); speak(st); }
  else { setSub(st); speak(st); }
  updateTabs();
}
function next() {
  const sc = SCENES[S.si];
  if (S.ti + 1 < sc.steps.length) goStep(S.si, S.ti + 1);
  else if (S.si + 1 < SCENES.length) goStep(S.si + 1, 0);
}

/* predict / hint / feedback */
function showAsk(st) {
  const a = st.ask, box = $('ask');
  const b = a.before; if (b) { if (b.out) { S.out = b.out; renderOut(); } if (b.viz) $('viz').innerHTML = viz(b.viz); }
  box.hidden = false;
  box.innerHTML = `<div class="lab">PREDICT THE ANSWER</div><div class="fb" style="color:var(--ink);font-weight:700">${lang(a.q)}</div>
    <div class="opts">${a.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div class="fb" id="afb" aria-live="polite"></div>
    <div class="askrow"><button class="mini" id="aHint">Show hint</button><button class="mini go" id="aNext" hidden>Continue →</button></div>`;
  const fb = $('afb');
  box.querySelector('#aHint').onclick = () => { fb.className = 'fb hint'; fb.innerHTML = 'Hint: ' + lang(a.hint); };
  box.querySelector('#aNext').onclick = () => { stopSpeech(); next(); };
  box.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.i;
    if (i === a.ok) {
      box.querySelectorAll('.opt').forEach(x => x.disabled = true);
      btn.classList.add('ok');
      fb.className = 'fb ok'; fb.innerHTML = lang(a.explain);
      const af = a.after; if (af) { if (af.out) S.out = af.out; renderCode(af.line, false); renderOut(); if (af.viz) $('viz').innerHTML = viz(af.viz); }
      setMood('wow'); setSub(a.explain); speak(a.explain);
      S.waiting = false; S.post = true; S.el = 0; S.dur = 3000 + a.explain.en.length * 68;
      box.querySelector('#aNext').hidden = false; box.querySelector('#aHint').hidden = true;
    } else {
      btn.classList.add('no'); btn.disabled = true; setMood('think');
      const w = (a.wrong && a.wrong[i]) || { en: 'Not quite. Try again!', ta: 'இல்ல. திரும்ப try பண்ணுங்க!' };
      fb.className = 'fb no'; fb.innerHTML = lang(w);
    }
  });
}

/* final practice */
function showPractice(st) {
  const p = st.practice, box = $('ask');
  box.hidden = false;
  box.innerHTML = `<div class="lab">QUICK PRACTICE</div><ol class="tasks">${p.tasks.map(t => `<li>${lang(t)}</li>`).join('')}</ol>
    <div class="fb" id="afb" aria-live="polite"></div>
    <div class="askrow"><button class="mini" id="pHint">Show hint</button><button class="mini go" id="pSol">Show sample solution</button><button class="mini go" id="pNext" hidden>Next topic →</button><button class="mini" id="pAgain" hidden>Replay lesson</button></div>`;
  const fb = $('afb');
  box.querySelector('#pHint').onclick = () => { fb.className = 'fb hint'; fb.innerHTML = 'Hint: ' + lang(p.hint); };
  box.querySelector('#pSol').onclick = () => {
    S.code = p.solution.code; S.out = p.solution.out; renderCode(-1, false); renderOut();
    $('viz').innerHTML = viz({ t: 'box', text: 'Maya', count: true, cap: 'my_name = "Maya" has 4 characters' });
    fb.className = 'fb ok'; fb.innerHTML = lang(p.finish); setMood('wow'); setSub(p.finish); speak(p.finish);
    box.querySelector('#pHint').hidden = true; box.querySelector('#pSol').hidden = true;
    box.querySelector('#pNext').hidden = false; box.querySelector('#pAgain').hidden = false;
    S.ended = true; S.done = true; updateTabs();
  };
  box.querySelector('#pNext').onclick = () => {
    fb.className = 'fb ok'; fb.textContent = 'Head back to EVOLV Adventure World and open the next topic. See you there!';
  };
  box.querySelector('#pAgain').onclick = () => { S.done = false; begin(); goStep(0, 0); };
}

/* tabs + progress */
function buildTabs() {
  $('tabs').innerHTML = SCENES.map((s, i) => `<button class="tab" data-i="${i}"><i></i><span>${i + 1}</span>${s.tab}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { begin(); goStep(+b.dataset.i, 0); });
}
function updateTabs() {
  const frac = S.waiting ? 0 : Math.min(1, S.el / S.dur);
  document.querySelectorAll('.tab').forEach((t, i) => {
    const n = SCENES[i].steps.length;
    let p = i < S.si ? 1 : i > S.si ? 0 : (S.ti + frac) / n;
    if (S.done) p = 1;
    t.style.setProperty('--p', p);
    t.classList.toggle('cur', i === S.si); t.classList.toggle('done', p >= 1);
  });
  let before = 0; for (let i = 0; i < S.si; i++) before += SCENES[i].steps.length;
  $('gprog').style.width = (S.done ? 100 : (before + S.ti + frac) / TOTAL * 100) + '%';
}

/* controls */
function begin() {
  if (S.started && !S.paused) return;
  S.started = true; S.paused = false; $('start').hidden = true; $('bPause').textContent = 'Pause';
  if (S.cur) speak(S.cur);
}
$('start').onclick = begin;
$('bPause').onclick = () => {
  if (!S.started || S.paused) { begin(); return; }
  S.paused = true; stopSpeech(); $('bPause').textContent = 'Play';
};
$('bScene').onclick = () => { begin(); goStep(S.si, 0); };
$('bRestart').onclick = () => { S.done = false; begin(); goStep(0, 0); };
$('bVoice').onclick = () => {
  S.voice = !S.voice; $('bVoice').setAttribute('aria-pressed', S.voice);
  if (S.voice) speak(S.cur); else stopSpeech();
};
$('selSub').onchange = e => { S.sub = e.target.value; renderSub(); };
$('selVoice').onchange = () => { if (S.cur) speak(S.cur); };

/* ambient music */
let ac = null, mTimer = null, mGain = null;
function playChord(i) {
  const chords = [[261.6, 329.6, 392], [220, 277.2, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]];
  chords[i % 4].forEach(f => {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + 1.2); g.gain.linearRampToValueAtTime(0, t + 4.2);
    o.connect(g); g.connect(mGain); o.start(); o.stop(t + 4.3);
  });
}
$('bMusic').onclick = () => {
  const on = $('bMusic').getAttribute('aria-pressed') !== 'true';
  $('bMusic').setAttribute('aria-pressed', on);
  try {
    if (on) {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.resume) ac.resume();
      mGain = ac.createGain(); mGain.gain.value = 0.05; mGain.connect(ac.destination);
      let i = 0; playChord(i++); mTimer = setInterval(() => playChord(i++), 3800);
    } else { clearInterval(mTimer); if (mGain) mGain.disconnect(); }
  } catch (e) { $('bMusic').setAttribute('aria-pressed', 'false'); }
};

/* main loop */
let last = 0;
function tick(t) {
  const dt = Math.min(100, t - last); last = t;
  if (S.started && !S.paused && !S.waiting && !S.ended) {
    S.el += dt;
    const spoken = !S.voice || !synth || S.speechDone || S.el > S.dur + 9000;
    if (S.el >= S.dur && spoken && !(S.si === SCENES.length - 1 && S.ti === SCENES[S.si].steps.length - 1)) next();
  }
  updateTabs();
  requestAnimationFrame(tick);
}
buildTabs();
goStep(0, 0);
$('bPause').textContent = 'Play';
requestAnimationFrame(tick);
</script>

</body></html>
