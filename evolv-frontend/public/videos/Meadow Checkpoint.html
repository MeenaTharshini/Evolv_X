function go(n,first){s=n;run++;locked=false;const v=$("#view");v.className="view";void v.offsetWidth;v.className="view in";n===0?intro():n===11?result():ques(n-1);chips();path();if(!first)$("#stage").scrollIntoView({behavior:"smooth",block:"start"})}
function intro(){$("#view").innerHTML=`<div class="tags" style="justify-content:center"><span class="pill">Topics 01–09 · 10 challenges</span></div><h1>Meadow Checkpoint:<br><em>Prove Your Python Powers!</em></h1>${win('print("Welcome to the Meadow!")',"meadow.py")}<div class="topics">${TOP.map(t=>`<span>${t}</span>`).join("")}</div><button class="btn" onclick="go(1)">Start the Quest →</button>`;
 say("Hi, I’m EVO! This is the last checkpoint of World 1. Answer each challenge to light up the meadow path and unlock World 2!","வணக்கம்! நான் EVO. World 1-ன் கடைசி checkpoint இது. ஒவ்வொரு சரியான பதிலும் meadow பாதையை ஒளிரச் செய்யும்!")}
function opts(q){const p=q.p?q.p[part]:q;$("#ask").textContent=p.q||q.q;$("#opts").innerHTML=p.o.map((o,k)=>`<button class="opt" onclick="pick(${k})"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}
function ques(n){const q=Q[n];tries=0;part=0;bv=["",""];$("#view").innerHTML=`<div class="tags"><span class="pill lv">${q.lv}</span><span class="pill">${q.tag}</span><span class="cnt">Challenge ${n+1} of 10</span></div><h2 class="qt">${q.t}</h2>${win(q.code,"meadow.py")}<div class="ask" id="ask"></div><div class="opts" id="opts"></div><div class="hint" id="hint" hidden></div><div class="conds" id="conds"></div><div class="out" id="out" hidden><small>▶ OUTPUT</small><span id="ot"></span></div><div class="why" id="why" hidden></div><div id="nx"></div>`;opts(q);say(q.en,q.ta)}
function fill(i,v){bv[i]=v;const b=$("#b"+(i+1));b.className="blank fill";b.innerHTML=hi(v)}
async function pick(k){if(locked||paused)return;const n=s-1,q=Q[n],pt=q.p?q.p[part]:q,bs=document.querySelectorAll(".opt"),id=run;
 if(k!==pt.a){tries++;bs[k].classList.add("bad");bs[k].disabled=true;const h=$("#hint");h.hidden=false;h.innerHTML="💡 <strong>Hint:</strong> "+(pt.h||q.h);say("Not quite — read the hint and try again!",TA.no);return}
 locked=true;bs.forEach(b=>b.disabled=true);bs[k].classList.add("good");$("#hint").hidden=true;
 if(q.p){fill(part,pt.o[pt.a]);if(part<q.p.length-1){say("Blank 1 fixed! Now the next blank.","சரி! இப்போது அடுத்த blank.");await sleep(900);if(id!==run)return;part++;opts(q);locked=false;chips();return}}
 res[n]=res[n]||(tries?2:1);path();chips();say(tries?"You got it! The path glows brighter with every try.":"Correct! The meadow path lights up!",TA.ok);
 document.querySelectorAll(".ln").forEach((l,i)=>l.classList.add(q.on.includes(i)?"on":"off"));await sleep(500);if(id!==run)return;
 for(const[t,v,lb]of q.c){$("#conds").insertAdjacentHTML("beforeend",`<span class="cd c${v}"><code>${esc(t)}</code><b>${lb||LAB[v]}</b></span>`);await sleep(600);if(id!==run)return}
 $("#out").hidden=false;for(const ch of q.out){$("#ot").textContent+=ch;await sleep(ch==="\n"?350:55);if(id!==run)return}
 await sleep(300);const w=$("#why");w.hidden=false;w.innerHTML="<strong>Why?</strong> "+q.w;
 $("#nx").innerHTML=`<button class="btn" onclick="go(${s+1})">${n===9?"Finish the Quest 🏁":"Next challenge →"}</button>`}
function meadow(){let g="",f="";for(let i=0;i<46;i++){const x=10+i*13+Math.random()*6,h=14+Math.random()*26,y=150+Math.random()*34;g+=`<path class="bl" d="M${x} ${y} q${(Math.random()-.5)*8} -${h/2} ${(Math.random()-.5)*10} -${h}" stroke="${i%3?"#4ade80":"#22c55e"}" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation-delay:${Math.random()*2}s"/>`}
 for(let i=0;i<14;i++){const x=30+i*42+Math.random()*16,y=135+Math.random()*40;f+=`<g class="fl" style="animation-delay:${.3+i*.12}s"><path d="M${x} ${y+16} V${y}" stroke="#2fa866" stroke-width="2"/><circle cx="${x}" cy="${y}" r="6" fill="${["#ffb84a","#ff6b9a","#4fd1ff","#ffffff"][i%4]}"/><circle cx="${x}" cy="${y}" r="2.5" fill="#fde68a"/></g>`}
 return`<svg viewBox="0 0 600 190"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1740"/><stop offset="1" stop-color="#14425a"/></linearGradient><radialGradient id="sg"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffb84a"/></radialGradient></defs><rect width="600" height="190" fill="url(#sk)"/><g class="sun"><circle cx="300" cy="104" r="46" fill="#ffb84a" opacity=".22"/><circle cx="300" cy="104" r="30" fill="url(#sg)"/></g><path d="M0 120 C100 80 200 130 300 105 S520 80 600 115 V190 H0Z" fill="#0f4a38"/><path d="M0 150 C120 110 240 160 360 135 S540 115 600 140 V190 H0Z" fill="#157a4a"/><path d="M0 172 C150 145 300 185 450 160 S560 150 600 160 V190 H0Z" fill="#1fa35f"/>${g}${f}<text class="bf" x="80" y="70" font-size="22">🦋</text><text class="bf b2" x="420" y="60" font-size="18">🦋</text></svg>`}
function result(){const f=res.filter(x=>x===1).length,r=10-f,xp=100+f*40+r*15,rank=f>=9?"Meadow Master":f>=7?"Meadow Ranger":f>=4?"Meadow Explorer":"Meadow Adventurer",
 rv=TOP.map((t,i)=>({t,ok:MAP.every((m,q)=>!m.includes(i)||res[q]===1)})),miss=rv.filter(x=>!x.ok).map(x=>x.t);
 const msg=f>=9?"Outstanding! You’ve mastered the Python basics.":f>=7?"Great work! Your Python foundations are strong.":f>=4?"Nice job finishing! A little revision will make these basics rock solid.":"You made it through — and that’s what counts. Every great coder learns by retrying!";
 $("#view").innerHTML=`<div class="meadow">${meadow()}</div><div class="ban">✦ WORLD 1 · MEADOW COMPLETE ✦</div><h1 style="margin:6px 0">Quest <em>Completed!</em></h1><div class="res"><svg class="badge" viewBox="0 0 120 140"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#0e7a4a"/></linearGradient></defs><path d="M60 6 L110 24 V70 C110 104 86 126 60 136 C34 126 10 104 10 70 V24 Z" fill="url(#bg)" stroke="#bff7d4" stroke-width="3"/><circle cx="60" cy="64" r="32" fill="#07102a"/><path d="M60 90 V62" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/><path d="M60 66 C46 66 40 56 42 48 C54 48 60 56 60 66Z" fill="#4ade80"/><path d="M60 62 C72 62 80 54 78 44 C66 44 60 52 60 62Z" fill="#ffb84a"/></svg><div><div class="score"><span id="sc">0</span><small> / 10 first-try</small></div><div style="color:var(--am);font-weight:800;margin-top:4px">🏅 ${rank}</div><div class="dots">${res.map((x,i)=>`<i class="${x===1?"g":""}" style="animation-delay:${i*.1}s"></i>`).join("")}</div></div></div><div class="xp"><b style="color:var(--am);font-size:22px">+<span id="xp">0</span> XP</b><div class="tr"><i id="xb"></i></div></div><p style="text-align:center;font-size:18px;margin:10px 0 4px">${msg}</p><div class="tg">${rv.map(x=>`<div class="${x.ok?"ok":"rv"}"><span>${x.t}</span><span>${x.ok?"✓ Mastered":"↻ Revise"}</span></div>`).join("")}</div>${miss.length?`<p style="text-align:center;color:var(--mu);margin:0">EVO suggests revisiting: ${miss.join(" · ")}</p>`:""}<button class="btn" onclick="this.textContent='🔓 World 2 unlocked!';this.disabled=true;path(true)">Unlock World 2</button><button class="btn alt" onclick="restart()">Retake checkpoint</button>`;
 say("Congratulations! You completed World 1, the Meadow. Python is now your superpower!","வாழ்த்துகள்! World 1 – Meadow முடிந்தது. Python இப்போது உன் superpower!");
 const st=$("#stage");for(let i=0;i<40;i++){const c=document.createElement("i");c.className="cf";c.style.cssText=`left:${Math.random()*100}%;background:${["#4fd1ff","#ffb84a","#4ade80","#ff6b9a"][i%4]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()}s`;st.appendChild(c);setTimeout(()=>c.remove(),6500)}
 let t=0;const iv=setInterval(()=>{t++;const a=$("#sc");if(!a)return clearInterval(iv);a.textContent=Math.min(f,t);$("#xp").textContent=Math.round(xp*Math.min(1,t/12));$("#xb").style.width=Math.min(100,xp/5)+"%";if(t>=12)clearInterval(iv)},140)}
function chips(){const dn=i=>i===0?s>0:i<11?!!res[i-1]:s===11;
 $("#chips").innerHTML=CH.map((c,i)=>`<div class="chip ${dn(i)?"done":i===s?"cur":""}"><div class="bar"><i style="width:${dn(i)?100:i===s?(i===10&&part?70:35):0}%"></i></div><span>${i+1}</span>${c}</div>`).join("")}
const P=$("#pLit"),B=$("#pBase"),D="M30,62 C140,8 250,112 370,58 S600,8 720,60 S900,104 970,48";let L=0;
function path(flash){const k=s===11?10:res.length-1,cur=s===11?-1:Math.min(res.length,10);P.style.strokeDashoffset=k<0?L:L-L*k/10;P.style.opacity=k<0?0:1;
 document.querySelectorAll(".nd").forEach((g,i)=>g.setAttribute("class","nd"+(i<=k||(flash&&i===10)?" done":i===cur?" cur":"")))}
function init(){B.setAttribute("d",D);P.setAttribute("d",D);L=P.getTotalLength();P.style.strokeDasharray=L;P.style.strokeDashoffset=L;
 $("#nodes").innerHTML=Array.from({length:11},(_,i)=>{const p=P.getPointAtLength(L*i/10);return`<g class="nd"><circle cx="${p.x}" cy="${p.y}" r="22"/><text x="${p.x}" y="${p.y}">${i<10?i+1:"★"}</text></g>`}).join("");
 const st=$("#stage");for(let i=0;i<14;i++){const f=document.createElement("i");f.className="ff";f.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*92}%;animation-delay:${Math.random()*6}s;animation-duration:${5+Math.random()*5}s`;st.appendChild(f)}
 go(0,true)}
function restart(){res=[];if(window.speechSynthesis)speechSynthesis.cancel();go(0)}
$("#bR").onclick=restart;$("#bRp").onclick=()=>go(s);
$("#bP").onclick=e=>{paused=!paused;document.body.classList.toggle("paused",paused);e.target.textContent=paused?"Resume":"Pause";if(window.speechSynthesis)paused?speechSynthesis.pause():speechSynthesis.resume()};
$("#bV").onclick=e=>{voiceOn=!voiceOn;e.target.classList.toggle("on",voiceOn);if(voiceOn)say(...nar);else if(window.speechSynthesis)speechSynthesis.cancel()};
$("#sel").onchange=e=>{sub=e.target.value;showSub()};
let ac,mOn=false;
$("#bM").onclick=e=>{mOn=!mOn;e.target.classList.toggle("on",mOn);try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const m=ac.createGain();m.gain.value=.05;m.connect(ac.destination);[196,247,294,392].forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.frequency.value=f;g.gain.value=.25;l.frequency.value=.1+k*.07;lg.gain.value=.2;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(m);o.start();l.start()})}mOn?ac.resume():ac.suspend()}catch(x){}};
init();
</script></body></html>
