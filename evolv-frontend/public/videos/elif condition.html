<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Making Multiple Decisions with Python: elif · EVOLV</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--p:#0f1730;--b:#25325a;--cy:#4dd0ff;--am:#ffb347;--gr:#4ade80;--rd:#ff6b81;--pu:#a78bfa;--tx:#e8ecff;--mu:#7f8bb3;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Outfit,system-ui,"Noto Sans Tamil",sans-serif}
body{padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.app{max-width:1060px;margin:auto}
.stage{position:relative;border:1px solid var(--b);border-radius:20px;padding:18px;min-height:600px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 0,#14204a66,transparent 70%),linear-gradient(#0c1328,#090e1c)}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.25em}
.bars{display:flex;gap:4px;align-items:flex-end;height:30px}.bars i{width:9px;border-radius:3px}
.badge{border:1px solid #2f8f63;color:var(--gr);background:#0f2a27;border-radius:99px;padding:4px 14px;font:600 13px JetBrains Mono,monospace}
h1{font-size:clamp(22px,4vw,40px);text-align:center;margin:2px 0;font-weight:800;line-height:1.15}h1 em{color:var(--am);font-style:normal}
.vis{width:100%;flex:1;display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes pu{50%{box-shadow:0 0 22px #4dd0ff88}}
.win{background:var(--p);border:1px solid var(--b);border-radius:12px;min-width:300px;box-shadow:0 8px 30px #0006;padding-bottom:8px}
.wb{display:flex;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--b);font:12px JetBrains Mono,monospace;color:var(--mu);margin-bottom:6px}
.d{width:11px;height:11px;border-radius:50%}
.cl{display:flex;font:500 15px/1.9 JetBrains Mono,monospace;padding:0 14px;white-space:pre;border-left:3px solid transparent;transition:.35s}
.cl b{color:#4a5680;width:26px;font-weight:400}
.cl.on{background:#4dd0ff1f;border-left-color:var(--cy)}.cl.run{background:#4ade8026;border-left-color:var(--gr)}.cl.dim{opacity:.28}
.k{color:var(--pu)}.s,.n{color:var(--gr)}.f{color:var(--cy)}
.showind .sp{background:#ffb34755;border-radius:3px}
.glowc .c{color:var(--am);font-weight:800;font-style:normal;animation:pu 1s infinite;text-shadow:0 0 10px var(--am)}
.flow{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:280px}
.cond{border:2px solid var(--cy);color:var(--cy);padding:10px 18px;border-radius:12px;font:600 15px JetBrains Mono,monospace;background:#0f1d3a;text-align:center}
.cond.go{animation:pu 1s infinite}
.tag{height:24px;font-weight:800;letter-spacing:.12em;opacity:0;transition:.3s}.tag.t{color:var(--gr);opacity:1}.tag.f{color:var(--rd);opacity:1}
.brs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.br{border:2px solid var(--b);border-radius:12px;padding:10px 14px;text-align:center;min-width:140px;transition:.45s;background:var(--p)}
.br small{display:block;font:12px JetBrains Mono,monospace;color:var(--mu);margin-top:3px}
.lb{display:block;font:700 11px JetBrains Mono,monospace;color:var(--mu);margin-bottom:4px}
.br.lit.i{border-color:var(--gr);background:#4ade8022;box-shadow:0 0 22px #4ade8055}.br.lit.e{border-color:var(--am);background:#ffb34720;box-shadow:0 0 22px #ffb34755}.br.skip{opacity:.22}
.out{border:1px dashed var(--b);border-radius:10px;padding:8px 14px;font:14px JetBrains Mono,monospace;min-width:230px;text-align:center;color:var(--mu)}.out code{color:var(--gr)}
.note,.q{border:1px solid var(--b);background:var(--p);border-radius:12px;padding:16px 20px;min-width:240px;max-width:300px;font-size:18px;line-height:1.5;text-align:center}
.q{font-size:20px}.cd{font:800 56px JetBrains Mono,monospace;color:var(--am)}
.rv{opacity:0;transform:translateY(10px);transition:.6s}.rv.show{opacity:1;transform:none}
.it{font-size:64px;text-align:center}.it small{display:block;font:600 14px Outfit;color:var(--mu)}
.hero{display:flex;gap:26px;justify-content:center;width:100%}
.hid{display:none}
.card{display:none;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}.card.show{display:flex}
.card h3{width:100%;text-align:center;margin:0;color:var(--am)}
.pn{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:10px 14px;min-width:290px}
.pn pre{margin:6px 0;font:500 14px/1.8 JetBrains Mono,monospace}.pn.bad{border-color:var(--rd)}.pn.good{border-color:var(--gr);opacity:0;transform:translateY(8px);transition:.5s}
.card.fx .pn.good{opacity:1;transform:none}.pn.bad .m{color:var(--rd)}.pn.good .m{color:var(--gr)}.m{font-size:14px}
.rc{border:1px solid var(--b);background:var(--p);border-radius:12px;padding:12px 18px;font-size:19px;width:min(520px,100%)}
.sub{width:100%;border:1px solid var(--b);background:#0b1226;border-radius:12px;padding:12px 18px;text-align:center;font-size:clamp(16px,2.3vw,22px);line-height:1.45;min-height:64px;display:flex;align-items:center;justify-content:center}
.big{position:absolute;inset:0;z-index:5;border:0;background:#080d1bcc;color:var(--am);font:800 28px Outfit;cursor:pointer;backdrop-filter:blur(3px)}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.tab{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:10px 12px;color:var(--tx);text-align:left;cursor:pointer;font:600 14px Outfit}
.tab i{display:block;height:4px;background:var(--b);border-radius:4px;margin-bottom:8px;overflow:hidden}.tab u{display:block;height:100%;width:0;background:var(--cy);transition:width .5s}
.tab span{color:var(--mu);margin-right:6px}.tab.act{border-color:var(--cy)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill,select{background:var(--p);border:1px solid var(--b);color:var(--tx);border-radius:14px;padding:12px 20px;font:600 15px Outfit;cursor:pointer}
.pill.am{background:var(--am);color:#1a1200;border-color:var(--am);border-radius:99px}.pill.on{border-color:var(--cy);color:var(--cy)}
select{padding:12px;max-width:100%}
.pl{display:flex;flex-direction:column;gap:8px;min-width:290px}.row{display:flex;align-items:center;gap:10px;border:2px solid var(--b);border-radius:12px;padding:9px 14px;background:var(--p);transition:.4s;font:600 14px JetBrains Mono,monospace}.row.chk{border-color:var(--cy);animation:pu 1s infinite}.row.win{border-color:var(--gr);background:#4ade8022;box-shadow:0 0 22px #4ade8055}.row.skip{opacity:.25}.chip{margin-left:auto;font:800 12px JetBrains Mono,monospace;color:var(--mu)}.chip.t{color:var(--gr)}.chip.f{color:var(--rd)}
</style></head><body><div class="app">
<div class="stage" id="stage">
<button class="big" id="big">▶ Start lesson</button>
<div class="logo"><div class="bars"><i style="height:14px;background:var(--am)"></i><i style="height:30px;background:var(--cy)"></i><i style="height:24px;background:#ff5d8f"></i></div>EVOLV</div>
<div class="badge" id="badge"></div><h1 id="title"></h1>
<div class="vis" id="vis"></div>
<div class="sub" id="sub"></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="ctl"><button class="pill am" id="pb">Play</button><button class="pill" id="rs">Restart</button><button class="pill on" id="vb">Voice</button><button class="pill" id="mb">Music</button>
<select id="ss"><option value="en">Subtitles: English</option><option value="ta">Subtitles: தமிழ் · Tamil</option><option value="off">Subtitles: Off</option></select><select id="vs"></select></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(/("[^"]*")|\b(if|elif|else)\b|\b(print)\b|\b(\d+)\b/g,(m,a,b,c,d)=>a?`<span class=s>${a}</span>`:b?`<span class=k>${b}</span>`:c?`<span class=f>${c}</span>`:`<span class=n>${d}</span>`).replace(/:$/,'<i class=c>:</i>');
const li=(s,i)=>{const m=s.match(/^ */)[0];return `<b>${i+1}</b><span class=sp>${m}</span>${hl(s.slice(m.length))}`};
const win=(n,L)=>`<div class=win id=W><div class=wb><i class=d style=background:#ff5f57></i><i class=d style=background:#febc2e></i><i class=d style=background:#28c840></i><span>${n}</span><span style=margin-left:auto>Python 3</span></div>${L.map((s,i)=>`<div class=cl id=L${i}>${li(s,i)}</div>`).join('')}</div>`;
const mark=(on=[],dim=[],run=[])=>$$('#W .cl').forEach((e,i)=>e.className='cl'+(on.includes(i)?' on':'')+(run.includes(i)?' run':'')+(dim.includes(i)?' dim':''));
const flow=(c,a,b)=>`<div class=flow><div class=cond id=fc>${c}</div><div class=tag id=ft></div><div class=brs><div class=br id=bi><span class=lb>TRUE</span><b class=k>if</b> block<small>${a}</small></div><div class=br id=be><span class=lb>FALSE</span><b class=k>else</b> block<small>${b}</small></div></div><div class=out>Output: <code id=ov>…</code></div></div>`;
const sf=o=>{if(o.c!=null){$('#fc').textContent=o.c;$('#fc').classList.add('go')}
if('tag'in o){const t=$('#ft');t.className='tag '+(o.tag||'');t.textContent=o.tag=='t'?'TRUE ✓':o.tag=='f'?'FALSE ✗':''}
if('lit'in o){$('#bi').className='br'+(o.lit=='i'?' lit i':o.lit=='e'?' skip':'');$('#be').className='br'+(o.lit=='e'?' lit e':o.lit=='i'?' skip':'')}
if('out'in o)$('#ov').textContent=o.out};
const rv=id=>$('#'+id)?.classList.add('show');
const S=(en,ta,run,d)=>({en,ta,run,d});
const G={h:[2,4,6,8],b:[3,5,7,9],t:[v=>v>=90,v=>v>=75,v=>v>=50],e:['mark >= 90','mark >= 75','mark >= 50'],o:['Grade A','Grade B','Grade C','Fail']};
const GL=['mark = 85','','if mark >= 90:','    print("Grade A")','elif mark >= 75:','    print("Grade B")','elif mark >= 50:','    print("Grade C")','else:','    print("Fail")'];
const P={h:[2,4,6],b:[3,5,7],t:[v=>v>10,v=>v>5],e:['number > 10','number > 5'],o:['Large','Medium','Small']};
const PL=['number = 7','','if number > 10:','    print("Large")','elif number > 5:','    print("Medium")','else:','    print("Small")'];
const panel=c=>`<div class=pl>${c.t.map((_,i)=>`<div class=row id=rw${i}><b class=k>${i?'elif':'if'}</b><span>${c.e[i]}</span><span class=chip id=ch${i}>?</span></div>`).join('')}<div class=row id=rw${c.t.length}><b class=k>else</b><span>none were true</span><span class=chip id=ch${c.t.length}>?</span></div><div class=out>Output: <code id=ov>…</code></div></div>`;
const chip=(i,s,t)=>{const e=$('#ch'+i);if(e){e.className='chip '+s;e.textContent=t}};
const rowc=(i,k)=>{const e=$('#rw'+i);if(e)e.className='row '+k};
const reset=c=>{for(let i=0;i<=c.t.length;i++){rowc(i,'');chip(i,'','?')}$('#ov').textContent='…';mark()};
async function ev(c,i,v,id){mark([c.h[i]]);rowc(i,'chk');chip(i,'','…');await wait(1000,id);if(id!==runId)return;const ok=c.t[i](v);rowc(i,'');chip(i,ok?'t':'f',ok?'TRUE ✓':'FALSE ✗');return ok}
function pick(c,i){const n=c.t.length,dim=c.h.concat(c.b).filter(x=>x!==c.h[i]&&x!==c.b[i]);mark([c.h[i]],dim,[c.b[i]]);rowc(i,'win');if(i==n)chip(n,'t','RUNS ✓');for(let j=i+1;j<=n;j++){rowc(j,'skip');chip(j,'',j==n?'skipped':'not checked')}$('#ov').textContent=c.o[i]}
async function walk(c,v,id){reset(c);const n=c.t.length;for(let i=0;i<n;i++){const ok=await ev(c,i,v,id);if(id!==runId)return;if(ok)return pick(c,i);await wait(400,id)}pick(c,n)}
const setv=(v)=>id=>{$('#L0').innerHTML=li('mark = '+v,0);return walk(G,v,id)};
const C=[['Mistake 1: repeating if','if mark >= 90:\n    print("Grade A")\nif mark >= 75:\n    print("Grade B")','if mark >= 90:\n    print("Grade A")\nelif mark >= 75:\n    print("Grade B")','Mark 95 prints A and B. Both ifs run!','Only Grade A prints. elif is skipped ✓'],
['Mistake 2: wrong order','if mark >= 50:\n    print("Grade C")\nelif mark >= 90:\n    print("Grade A")','if mark >= 90:\n    print("Grade A")\nelif mark >= 50:\n    print("Grade C")','Mark 95 prints Grade C. First match wins!','Highest condition first → Grade A ✓'],
['Mistake 3: forgot the colon','elif mark >= 75\n    print("Grade B")','elif mark >= 75:\n    print("Grade B")','SyntaxError: expected ":"','Colon added ✓'],
['Mistake 4: wrong indentation','elif mark >= 75:\nprint("Grade B")','elif mark >= 75:\n    print("Grade B")','IndentationError: expected an indented block','Indented: print belongs to elif ✓'],
['Mistake 5: every condition runs?','mark = 85\nif mark >= 75:\n    print("Grade B")\nelif mark >= 50:\n    print("Grade C")','mark = 85\nif mark >= 75:\n    print("Grade B")\nelif mark >= 50:\n    print("Grade C")','Myth: 85 prints B and C','Reality: only Grade B. 50 is never checked ✓']];
const cards=C.map((c,i)=>`<div class=card id=c${i}><h3>${c[0]}</h3><div class="pn bad"><b>✗ Mistake</b><pre>${c[1].split('\n').map(hl).join('\n')}</pre><div class=m>${c[3]}</div></div><div class="pn good"><b>✓ Fixed</b><pre>${c[2].split('\n').map(hl).join('\n')}</pre><div class=m>${c[4]}</div></div></div>`).join('');
const card=n=>async id=>{$$('.card').forEach(e=>e.classList.remove('show','fx'));$('#c'+n).classList.add('show');await wait(3800,id);$('#c'+n)?.classList.add('fx')};
const rc=['🔀 elif checks another condition when the one before is false','⬇️ Python goes top to bottom and stops at the first True','🛟 else runs only when nothing matched','⌨️ Order matters. Use colons and indentation'];
const note=h=>()=>{$('#nt').innerHTML=h};
const SC=[
{tab:'Intro',badge:'Real-life decision',title:'Making Multiple Decisions with Python: <em>elif</em>',
html:`<div class=vis style="flex-direction:column"><div class=hero><div class="it rv" id=a1>🧑‍🎓<small>Student</small></div><div class="it rv" id=a2>📝<small>Mark: 85</small></div></div><div class="brs rv" id=a3><div class=br>≥ 90<small>Grade A</small></div><div class=br>≥ 75<small>Grade B</small></div><div class=br>≥ 50<small>Grade C</small></div><div class=br>below 50<small>Fail</small></div></div><div class="cond rv" id=a4><b class=k>if</b> · <b class=k>elif</b> · <b class=k>else</b></div></div>`,
steps:[S('Imagine a teacher assigning grades based on marks.','Teacher marks-ஐ வச்சு grade கொடுக்குறார்னு நினைச்சுக்கோ.',async id=>{rv('a1');await wait(1200,id);rv('a2')}),
S('How can Python choose the correct grade?','சரியான grade-ஐ Python எப்படி தேர்ந்தெடுக்கும்?',()=>rv('a3')),
S('We use if, elif, and else to check different possibilities!','if, elif, else வச்சு பல possibilities-ஐ சரிபார்க்கலாம்!',()=>rv('a4'))]},
{tab:'Syntax',badge:'The syntax',title:'Meet <em>if</em>, <em>elif</em> and <em>else</em>',
html:`<div class=vis>${win('syntax.py',['if condition1:','    statement1','elif condition2:','    statement2','elif condition3:','    statement3','else:','    default_statement'])}<div class=note id=nt>Python checks conditions in order</div></div>`,
steps:[S('The if line checks the first condition.','if வரி முதல் condition-ஐ சரிபார்க்கும்.',()=>{mark([0]);note('<b class=k>if</b> checks the first condition')()}),
S('elif means else if. It checks another condition when the one before it is false.','elif-னா else if. முன்னாடி condition False-ன்னா அடுத்ததை சரிபார்க்கும்.',()=>{mark([2,4]);note('<b class=k>elif</b> = else if<br>Checked only if the one above is False')()}),
S('else runs when none of the conditions is true.','எந்த condition-உம் True இல்லைன்னா else ஓடும்.',()=>{mark([6,7]);note('<b class=k>else</b> = nothing matched')()}),
S('Python runs only the first matching branch.','முதல்ல match ஆகுற branch மட்டும்தான் ஓடும்.',()=>{mark([0,2,4,6]);note('Only the <b style=color:var(--gr)>FIRST True</b> branch runs')()}),
S('Colons and correct indentation are essential.','colon-உம் சரியான indentation-உம் ரொம்ப முக்கியம்.',()=>{mark([1,3,5,7]);$('#W').classList.add('glowc','showind');note('Colon <b style=color:var(--am)>:</b> + 4 spaces = a block')()})]},
{tab:'Example',badge:'Real Python example',title:'Checking <em>top to bottom</em>',html:`<div class=vis>${win('grades.py',GL)}${panel(G)}</div>`,
steps:[S('The mark is 85. Python reads the code from top to bottom.','mark 85. Python மேலிருந்து கீழே படிக்கும்.',()=>{reset(G);mark([0])}),
S('First check: is 85 greater than or equal to 90? No. It is False.','முதல் check: 85 >= 90? இல்ல, False.',id=>ev(G,0,85,id)),
S('Next check: is 85 greater than or equal to 75? Yes! It is True, so Python prints Grade B.','அடுத்து: 85 >= 75? ஆமா, True! அதனால Grade B print ஆகும்.',async id=>{await ev(G,1,85,id);if(id===runId)pick(G,1)}),
S('The other branches are skipped. Python stops at the first True condition, so it never checks 50.','மற்ற branch-கள் skip. முதல் True கிடைச்சதும் Python நின்னுடும்; 50-ஐ check பண்ணாது.',()=>{})]},
{tab:'Change marks',badge:'Change the input',title:'Same code, <em>new marks</em>',html:`<div class=vis>${win('grades.py',GL)}${panel(G)}</div>`,
steps:[S('Change the mark to 95. 95 is at least 90, so the first condition is True. Grade A!','mark 95-ஆ மாத்து. 95 >= 90 True, அதனால Grade A!',setv(95)),
S('Now 60. False, False, then 60 is at least 50, so Grade C.','இப்போ 60. False, False, அப்புறம் 60 >= 50 True: Grade C.',setv(60)),
S('Now 30. Every condition is False, so the else branch runs: Fail.','இப்போ 30. எல்லாம் False, அதனால else ஓடும்: Fail.',setv(30)),
S('Same code, different input, different result!','அதே code, வேற input, வேற result!',()=>{})]},
{tab:'Mistakes',badge:'Common mistakes',title:'Avoid these <em>traps</em>',html:`<div class=vis style="flex-direction:column">${cards}</div>`,
steps:[S('Mistake one: repeating if. Mark 95 would print both grades. Use elif instead.','தவறு 1: if-ஐ திரும்ப திரும்ப போடாதே. elif பயன்படுத்து.',card(0),6500),
S('Mistake two: wrong order. The first match wins, so put the highest condition first.','தவறு 2: order தப்பு. முதல் match ஜெயிக்கும், பெரிய condition முதல்ல போடு.',card(1),6500),
S('Mistake three: forgetting the colon. Add it after every condition.','தவறு 3: colon மறந்துட்டா error. ஒவ்வொரு condition-க்கும் : சேர்.',card(2),6000),
S('Mistake four: wrong indentation. Indent the line under the condition.','தவறு 4: indentation தப்பு. condition-க்கு கீழ உள்ளே தள்ளு.',card(3),6000),
S('Mistake five: thinking every condition runs. Only the first match runs.','தவறு 5: எல்லா condition-உம் ஓடும்னு நினைக்காதே. முதல் match மட்டும்தான்.',card(4),6500)]},
{tab:'Challenge',badge:'Your turn',title:'Prediction <em>challenge</em>',
html:`<div class=vis>${win('size.py',PL)}<div class=q id=q>🤔 Predict the output<div class=cd id=cd>?</div></div><div id=fw class=hid>${panel(P)}</div></div>`,
steps:[S('Challenge time! Read this code and predict the output.','சவால் நேரம்! output என்னன்னு யூகி.',()=>mark()),
S('Pause and think. Is 7 greater than 10? Is 7 greater than 5?','யோசி. 7 > 10? 7 > 5?',async id=>{for(let n=6;n>0;n--){const e=$('#cd');if(!e||id!==runId)return;e.textContent=n;await wait(1000,id)}},7000),
S('The first condition is False. The second is True, so Python prints Medium. The else branch is skipped.','முதல் False. இரண்டாவது True, அதனால Medium print ஆகும். else skip.',async id=>{$('#q').classList.add('hid');$('#fw').classList.remove('hid');await walk(P,7,id)})]},
{tab:'Wrap-up',badge:'Wrap-up',title:'You can now choose <em>from many</em>!',
html:`<div class=vis style="flex-direction:column">${rc.map((t,i)=>`<div class="rc rv" id=r${i}>${t}</div>`).join('')}</div>`,
steps:[S('elif checks another condition when the one before it is false. Python goes top to bottom and stops at the first True.','முன்னாடி False-ன்னா elif அடுத்ததை check பண்ணும். முதல் True-ல நின்னுடும்.',async id=>{rv('r0');await wait(2500,id);rv('r1')}),
S('else catches everything left. Remember the order, colons and indentation. Now try your own marks!','மீதி எல்லாத்துக்கும் else. order, colon, indentation நினைவுல வை. நீயே marks மாத்தி முயற்சி பண்ணு!',async id=>{rv('r2');await wait(2500,id);rv('r3')})]}];
// ---- player
let runId=0,paused=false,started=false,ended=false,voiceOn=true,cur=null;
$('#tabs').innerHTML=SC.map((s,i)=>`<button class=tab onclick="start(${i})"><i><u></u></i><span>${i+1}</span>${s.tab}</button>`).join('');
const prog=(s,k,n)=>$$('.tab').forEach((t,i)=>{t.classList.toggle('act',i==s);t.querySelector('u').style.width=(i<s?100:i>s?0:Math.round((k+.5)/n*100))+'%'});
function load(i){const s=SC[i];$('#badge').textContent=s.badge;$('#title').innerHTML=s.title;$('#vis').innerHTML=s.html;$('#vis').style.animation='none';void $('#vis').offsetWidth;$('#vis').style.animation=''}
async function wait(ms,id){let t=0;while(t<ms){await new Promise(r=>setTimeout(r,100));if(id!==runId)return;if(!paused)t+=100}}
function speak(txt){return new Promise(res=>{const u=new SpeechSynthesisUtterance(txt),v=speechSynthesis.getVoices().find(v=>v.name===$('#vs').value);if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=.95;u.onend=u.onerror=res;speechSynthesis.speak(u)})}
function sub(){const l=$('#ss').value;$('#sub').textContent=!cur||l=='off'?'':cur[l]}
async function runStep(st,id){cur=st;sub();st.run&&st.run(id);const n=st.en.length;
await Promise.all([wait(st.d||Math.max(2800,n*62),id),voiceOn?Promise.race([speak(st.en),wait(n*130+3000,id)]):0])}
async function start(i=0){const id=++runId;started=true;ended=false;paused=false;speechSynthesis.cancel();$('#big').style.display='none';$('#pb').textContent='Pause';
for(let s=i;s<SC.length;s++){load(s);const st=SC[s].steps;for(let k=0;k<st.length;k++){if(id!==runId)return;prog(s,k,st.length);await runStep(st[k],id)}if(id!==runId)return;prog(s+1,0,1);$$('.tab')[s].querySelector('u').style.width='100%'}
ended=true;cur=null;$('#pb').textContent='Replay';$('#sub').textContent='🎉 Great job!'}
$('#big').onclick=()=>start(0);$('#rs').onclick=()=>start(0);
$('#pb').onclick=()=>{if(!started||ended)return start(0);paused=!paused;paused?speechSynthesis.pause():speechSynthesis.resume();$('#pb').textContent=paused?'Resume':'Pause'};
$('#vb').onclick=e=>{voiceOn=!voiceOn;e.target.classList.toggle('on',voiceOn);if(!voiceOn)speechSynthesis.cancel()};
$('#ss').onchange=sub;
let ac,mt=0,mi=0;const chord=()=>{[[220,261.6,329.6],[174.6,220,261.6],[196,261.6,329.6],[196,246.9,293.7]][mi++%4].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.8);g.gain.linearRampToValueAtTime(0,t+3);o.start(t);o.stop(t+3.1)})};
$('#mb').onclick=e=>{if(mt){clearInterval(mt);mt=0}else{ac=ac||new AudioContext();chord();mt=setInterval(chord,2600)}e.target.classList.toggle('on',!!mt)};
function voices(){const v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));if(!v.length){$('#vs').innerHTML='<option>Default voice</option>';return}
const pick=v.find(x=>/UK English Female/.test(x.name))||v[0];$('#vs').innerHTML=v.map(x=>`<option ${x===pick?'selected':''}>${x.name}</option>`).join('')}
voices();speechSynthesis.onvoiceschanged=voices;
load(0);prog(0,-.5,1);
</script></body></html>
