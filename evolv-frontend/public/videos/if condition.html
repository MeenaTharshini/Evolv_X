{ti:"Intro · The rain decision",x:"story",s:{e:"Imagine you go outside only when it is raining. How can you tell a computer to make this decision? Python uses an if condition!",t:"மழை பெய்யும்போது மட்டுமே வெளியே செல்வீர்கள் என்று வைத்துக் கொள்ளுங்கள். இந்த முடிவை கணினிக்கு எப்படிச் சொல்வது? பைத்தான் if நிபந்தனையைப் பயன்படுத்துகிறது!",h:"सोचिए आप सिर्फ़ बारिश होने पर बाहर जाते हैं। कंप्यूटर को यह फ़ैसला कैसे बताएँ? Python इसके लिए if कंडीशन इस्तेमाल करता है!"}},

{ti:"Syntax · The colon",c:"syn",hl:[0],n:SY(2),s:{e:"The colon marks the start of the code block.",t:"கோலன் (:) குறியீட்டுத் தொகுதியின் தொடக்கத்தைக் குறிக்கிறது.",h:"कोलन (:) कोड ब्लॉक की शुरुआत बताता है।"}},
{ti:"Syntax · Indentation",c:"syn",hl:[1],n:SY(3),s:{e:"The indented line is controlled by the condition. Indentation shows which statement belongs to the if.",t:"உள்தள்ளிய வரி நிபந்தனையின் கட்டுப்பாட்டில் இருக்கும். எந்த வரி if-க்கு சொந்தம் என்பதை இது காட்டுகிறது.",h:"इंडेंट वाली लाइन शर्त के नियंत्रण में होती है। इंडेंटेशन बताता है कि कौन सी लाइन if की है।"}},
{ti:"Example · raining is True",c:"e1",hl:[0],s:{e:"Now an example. The variable raining stores True.",t:"ஒரு எடுத்துக்காட்டு. raining என்ற மாறியில் True உள்ளது.",h:"अब एक उदाहरण। raining वेरिएबल में True है।"}},
{ti:"Example · raining is True",c:"e1",hl:[2],n:[["raining  →  True","T","TRUE"]],s:{e:"Python checks the condition. raining is True.",t:"பைத்தான் நிபந்தனையைச் சோதிக்கிறது. raining True.",h:"Python शर्त जाँचता है। raining True है।"}},
{ti:"Example · raining is True",c:"e1",hl:[3],o:"Take an umbrella!",n:[["raining  →  True","T","TRUE"],["print line runs","R","RUNS"]],s:{e:"The condition is True, so the indented line runs. Look at the output!",t:"நிபந்தனை True, எனவே உள்தள்ளிய வரி இயங்கும். வெளியீட்டைப் பாருங்கள்!",h:"शर्त True है, इसलिए इंडेंट वाली लाइन चलती है। आउटपुट देखिए!"}},
