{t:"Welcome to the Variable Meadow",m:1,mem:1,st:[
["Welcome to the Variable Meadow! I’m EVO, and today we’ll learn one of the most useful ideas in Python: variables.","Variable Meadow-க்கு வரவேற்கிறேன்! நான் EVO. இன்று Python-ன் மிகவும் பயனுள்ள ஒரு விஷயம் – variables-ஐக் கற்கப்போகிறோம்."],
["Think of a variable as a labeled box. The label is the variable’s name, and inside the box we keep some information.","Variable என்பது label ஒட்டிய ஒரு பெட்டி. Label தான் பெயர்; உள்ளே தகவல் இருக்கும்.",{set:NM}],

["On the left is the variable’s name. The equals sign is called assignment. It means: take the value on the right, and store it in the box on the left.","இடப்பக்கம் variable-ன் பெயர். = என்பது assignment: வலப்பக்க மதிப்பை இடப்பக்க பெட்டியில் சேமி.",{hl:0}],

["To see what’s inside a box, we use print. Line three says: print name.","பெட்டிக்குள் என்ன இருக்கிறது என்று பார்க்க print பயன்படுத்துவோம். மூன்றாம் வரி: print name.",{hl:2}],
["Python opens the box called name, takes out the value, and shows Maya in the output panel. There are no quotes around name, because we want the box, not the word.","Python name பெட்டியைத் திறந்து Maya-வை Output-ல் காட்டுகிறது. name-க்கு quotes இல்லை – வார்த்தை அல்ல, பெட்டி வேண்டும்.",{hl:2,out:"Maya"}],

["That’s the power of a variable: store once, update when needed, reuse anywhere.","இதுதான் variable-ன் சக்தி: ஒரு முறை சேமி, தேவைப்பட்டால் மாற்று, எங்கும் பயன்படுத்து.",{hl:-1}]]},
{t:"Naming Variables",st:[

["Student underscore name is valid. Letters and underscores are great, and the underscore joins words together.","student_name சரியான பெயர். எழுத்துகளும் underscore-ம் அனுமதி.",{card:["student_name",1,"Letters and underscores are allowed."]}],
["Score2 is valid too. Numbers are allowed inside a name, just not at the very start.","score2 கூட சரி. எண்கள் பெயரில் வரலாம்; முதலில் கூடாது.",{card:["score2",1,"A number is fine after the first letter."]}],
["But 2score is invalid, because a name can never start with a number.","ஆனால் 2score தவறு; பெயர் எண்ணில் தொடங்கக்கூடாது.",{card:["2score",0,"Names can’t start with a number."]}],
["And student dash name is invalid. Names can’t contain dashes or spaces, so use an underscore instead.","student-name தவறு. dash, space கூடாது; underscore பயன்படுத்து.",{card:["student-name",0,"No dashes or spaces. Use _ instead."]}],
["Tip: choose names that describe what’s inside, like student_name or score. Your future self will thank you!","உள்ளே என்ன இருக்கிறது என்று சொல்லும் பெயர்களை வை, student_name போல."]]},

const CH=["Welcome","Creating","Data types","Printing","Updating","Naming","Challenge","Recap","Practice"],TAN="பரவாயில்லை! Hint-ஐப் பார்த்து மீண்டும் முயற்சி செய்!";
const sp=t=>t.replace(/Score2|score2/g,"score two").replace(/2score/g,"two score");
const hasTa=()=>speechSynthesis.getVoices().some(v=>/^ta/i.test(v.lang));
function pickVoice(l){const all=speechSynthesis.getVoices(),vs=all.filter(v=>v.lang.toLowerCase().startsWith(l));if(l==="ta")return vs[0];const c=VO&&all.find(v=>v.name===VO);return c||vs.find(v=>/google uk english female|natural|online|aria|jenny|sonia|libby|samantha/i.test(v.name))||vs.find(v=>/en[-_](GB|US)/i.test(v.lang))||vs[0]}
function fillV(){if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return;VO=null;const b=pickVoice("en");VO=b&&b.name;$("#vsel").innerHTML=vs.map(v=>`<option>${v.name}</option>`).join("");$("#vsel").value=VO}
function duck(on){try{if(mg&&ac)mg.gain.setTargetAtTime(on?.012:.05,ac.currentTime,.15)}catch(e){}}
function say(en,ta){nar=[en,ta];showSub();const tk=++spk;speaking=false;if(!window.speechSynthesis)return;speechSynthesis.cancel();if(!voiceOn)return;const tm=aud==="ta"&&hasTa(),u=new SpeechSynthesisUtterance(sp(tm?ta:en)),v=pickVoice(tm?"ta":"en");if(v){u.voice=v;u.lang=v.lang}else u.lang=tm?"ta-IN":"en-GB";u.rate=.92;speaking=true;duck(true);u.onend=u.onerror=()=>{if(tk===spk){speaking=false;duck(false)}};speechSynthesis.speak(u)}
let sx;const SF={drop:[[420,0,.14,"triangle"],[300,.07,.22,"triangle"]],swap:[[300,0,.12],[500,.1,.12],[760,.2,.2]],tick:[[1300,0,.05,"square"]],good:[[523,0,.14],[659,.1,.14],[784,.2,.3]],bad:[[190,0,.28,"sawtooth"]],chime:[[660,0,.16],[880,.12,.28]],ping:[[880,0,.18]],fan:[[523,0,.2],[659,.15,.2],[784,.3,.2],[1047,.45,.6]]};
function sfx(k){if(paused)return;try{sx=sx||new(window.AudioContext||window.webkitAudioContext)();if(sx.state==="suspended")sx.resume();for(const[f,s,d,ty]of SF[k]){const o=sx.createOscillator(),g=sx.createGain(),t=sx.currentTime+s;o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(k==="tick"||k==="bad"?.04:.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(sx.destination);o.start(t);o.stop(t+d+.05)}}catch(e){}}
function showSub(){const e=$("#sub");e.style.visibility=sub==="off"?"hidden":"visible";e.textContent=sub==="ta"?nar[1]:nar[0]}
async function wait(ms,id){let t=0;const min=voiceOn?1200:ms;while(t<min||(voiceOn&&speaking&&t<ms*2+6000)){await new Promise(r=>setTimeout(r,100));if(id!==run)return;if(!paused)t+=100}
 if(voiceOn){await new Promise(r=>setTimeout(r,450))}}

function setVar(n,v,t,id){let e=$("#vb_"+n);if(!e){$("#boxes").insertAdjacentHTML("beforeend",`<div class="vb ${t}" id="vb_${n}"><div class="lab">${n}</div><div class="bx"><span class="val">${hi(v)}</span></div><div class="ty">${TY[t]}</div></div>`);sfx("drop");return}
 const val=e.querySelector(".val");sfx("swap");val.innerHTML=`<s>${val.innerHTML}</s>`;e.classList.add("chg");setTimeout(()=>{if(id===run){val.innerHTML=hi(v);e.classList.remove("chg");val.style.animation="none";void val.offsetWidth;val.style.animation=""}},900)}
const out=t=>{sfx("tick");$("#ot").insertAdjacentHTML("beforeend",`<div class="ol">${esc(t)}</div>`)};

 if(a.set)(Array.isArray(a.set[0])?a.set:[a.set]).forEach(v=>setVar(...v,id));if(a.out!=null)out(a.out);
 if(a.card)sfx(a.card[1]===0?"bad":a.card[1]===1?"good":"ping");if(a.card)$("#cards").insertAdjacentHTML("beforeend",`<div class="nm c${a.card[1]}"><code>${esc(a.card[0])}</code><b>${LB[a.card[1]]}</b><p>${a.card[2]}</p></div>`)}

async function ask(q,id){say(q.en,q.ta);const qa=$("#qa");
 qa.innerHTML=`${q.code?win(q.code,"challenge.py")+'<div class="out"><small>▶ OUTPUT</small><div id="ot"></div></div>':""}<div class="ask">${q.q}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div><div class="hint" id="hint" hidden></div><div id="why"></div>`;
 const tr=await new Promise(res=>{let t=0;qa.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(paused||id!==run)return;const k=+b.dataset.k;
  if(k!==q.a){t++;sfx("bad");b.classList.add("bad");b.disabled=true;const h=$("#hint");h.hidden=false;h.innerHTML="💡 <strong>Hint:</strong> "+q.h;say("Not quite — read the hint and try again!",TAN);return}
  qa.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("good");sfx("good");$("#hint").hidden=true;res(t)})});
 if(id!==run)return false;if(!tr)qs++;say(tr?"You got it! Let’s see why.":"Correct! Let’s see why.","சரி! ஏன் என்று பார்ப்போம்.");
 if(q.code){const L=document.querySelectorAll("#qa .ln");for(let k=0;k<L.length;k++){L.forEach((l,j)=>l.className="ln"+(j===k?" on":j>k?" off":""));await wait(800,id);if(id!==run)return false}out(q.out)}
 $("#why").innerHTML=`<div class="why"><strong>Why?</strong> ${q.w}</div><button class="btn" id="cont">Continue →</button>`;
 await new Promise(r=>$("#cont").onclick=r);return id===run}

 if(S.quiz){for(const q of S.quiz)if(!await ask(q,id))return}

 say("You did it! You can now create, update, name and print variables. Next up: numbers and calculations. See you there!","சபாஷ்! இனி variables-ஐ உருவாக்கி, மாற்றி, பெயரிட்டு, print செய்யலாம். அடுத்தது: Numbers and Calculations!");
 const st=$("#stage");for(let i=0;i<40;i++){const c=document.createElement("i");c.className="cf";c.style.cssText=`left:${Math.random()*100}%;background:${["#4fd1ff","#ffb84a","#4ade80","#ff6b9a"][i%4]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()}s`;st.appendChild(c);setTimeout(()=>c.remove(),6500)}}
