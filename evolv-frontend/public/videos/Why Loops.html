<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let run=0,paused=false,voiceOn=false,sub="en",nar=["",""],sc=0,qs=0,speaking=false,aud="en",VO=null,spk=0;
const hi=l=>esc(l).replace(/("[^"]*")|\b(True|False)\b|\b(\d+(?:\.\d+)?)\b|\b(for|in)\b|\b(?:print|range)\b/g,(m,a,b,n,k)=>k?`<i class=k>${m}</i>`:a?`<i class=s>${m}</i>`:b?`<i class=b>${m}</i>`:n?`<i class=n>${m}</i>`:`<i class=f>${m}</i>`);
const win=(c,f)=>`<div class="win"><div class="wh"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>${f}</span><span>Python 3</span></div>${c.split("\n").map((l,k)=>`<div class="ln"><span class="n">${k+1}</span><code>${hi(l)}</code></div>`).join("")}</div>`;

{t:"Real-Life Applications",st:[

["First, sending repeated reminders: the same message, sent again whenever it’s needed.","முதலாவது, நினைவூட்டல்கள்: அதே செய்தி மீண்டும் மீண்டும்.",{card:["🔔 Repeated reminders",2,"Send the same message again and again.","REPEAT"]}],

{t:"Understanding Iteration",code:LOOP,st:[
["Let’s picture a loop as a walk through the forest. I will visit five glowing checkpoints, and each checkpoint is one iteration.","Loop-ஐ காட்டில் ஒரு நடை போல நினைத்துப் பார். நான் ஐந்து ஒளிரும் checkpoints-ஐ பார்வையிடுவேன்; ஒவ்வொன்றும் ஒரு iteration.",{hl:-1,cp:5}],
["Iteration is a fancy word for one pass through the loop: one time the repeated instructions run.","Iteration என்றால் loop வழியாக ஒரு முறை செல்வது: repeat ஆகும் instructions ஒரு முறை இயங்குவது."],
["Off I go! At every checkpoint the counter goes up, the code runs once, and Hello is printed.","கிளம்புகிறேன்! ஒவ்வொரு checkpoint-லும் counter உயரும்; code ஒரு முறை இயங்கும்; Hello print ஆகும்.",{run:{n:5,head:0,body:1,out:"Hello!",cp:1}}],
["After the fifth iteration the counter has reached five, and the loop stops by itself. Python then moves on.","ஐந்தாவது iteration-க்குப் பிறகு counter 5-ஐ அடைந்து loop தானாக நிற்கிறது. பிறகு Python அடுத்த வேலைக்குச் செல்லும்.",{mood:"happy"}],
["So five iterations means the instructions ran five times. One repeat equals one iteration.","ஐந்து iterations என்றால் instructions ஐந்து முறை இயங்கின. ஒரு repeat = ஒரு iteration."]]},
