<style>

.vb{text-align:center;animation:pop .5s}.vb.str{--c:#ffb84a}.vb.int{--c:#4fd1ff}.vb.float{--c:#4ade80}.vb.bool{--c:#a78bfa}

.val{font:600 20px var(--mono);animation:drop .6s}.val s{color:var(--rd);opacity:.7}

.chip{cursor:pointer}.chip:hover{border-color:var(--cy)}#qa .win{margin-top:8px}#why .btn{margin-bottom:4px}

.nb{min-width:54px;height:54px;display:grid;place-items:center;padding:0 10px;border-radius:12px;font:700 22px var(--mono);background:#10264a;border:2px solid var(--cy);color:var(--cy);box-shadow:0 0 16px -3px var(--cy);animation:drop .6s backwards}

.op{font:800 26px var(--mono);color:var(--am);animation:pop .4s backwards}

.ln.hid{opacity:0;transform:translateX(-16px)}

u{text-decoration:none;border-radius:5px;padding:0 2px;transition:.3s}

<div class="app">
<section class="stage" id="stage">
 <div class="logo"><svg width="34" height="34" viewBox="0 0 34 34"><rect x="2" y="18" width="8" height="14" rx="3" fill="#ffb84a"/><rect x="13" y="8" width="8" height="24" rx="3" fill="#4fd1ff"/><rect x="24" y="2" width="8" height="30" rx="3" fill="#ff6b9a"/></svg>EVOLV</div>

</section>

<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let run=0,paused=false,voiceOn=false,sub="en",nar=["",""],sc=0,qs=0,speaking=false,aud="en",VO=null,spk=0;
